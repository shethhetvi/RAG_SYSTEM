<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioluminescent Interface - RAG System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="organism-container">
        <!-- Document "Feeding" Zone -->
        <div class="feeder-zone" id="feederZone">
            <div class="feeder-core">
                <span class="feeder-text">Drop Data to Nourish</span>
                <input type="file" id="fileInput" class="hidden-input" multiple>
                <div class="feeder-pulse"></div>
            </div>
            <div id="fedFiles" class="fed-files"></div>
        </div>

        <!-- The Central Entity (Chat/Query Area) -->
        <div class="entity-core">
            <div class="entity-halo"></div>
            <div class="entity-content">
                <div class="messages" id="messageContainer">
                    <div class="message entity-message">
                        <span class="glitch-text">I am listening. Feed me context, or ask your question.</span>
                    </div>
                </div>
            </div>
            
            <div class="input-membrane">
                <input type="text" id="queryInput" class="organic-input" placeholder="Communicate with the entity..." autocomplete="off">
                <button id="sendBtn" class="organic-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Ambient Floating Particles -->
    <div class="ambient-particles" id="particles"></div>

    <script src="js/main.js"></script>
</body>
</html>
